version: '3.8'

services:
  api:
    image: clara690/job_api:${DOCKER_IMAGE_VERSION}
    # api/config.py reads MYSQL_PASSWORD from a plain environment variable —
    # this command reads the secret's file contents and exports it as that
    # variable before starting uvicorn, so the real password is never
    # written into the image, the compose file, or an environment variable
    # visible via `docker service inspect`.
    command: >
      sh -c "export MYSQL_PASSWORD=$$(cat /run/secrets/mysql_user_password_v2) &&
             uv run uvicorn api.main:app --host 0.0.0.0 --port 8001"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_ACCOUNT: user
    secrets:
      - mysql_user_password_v2
    ports:
      # TEMPORARY — published directly so you can test with curl before
      # Caddy exists. Once Caddy is in front of this, remove this and let
      # only Caddy be reachable from outside.
      - "8001:8001"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.app==true]
    networks:
      - my_swarm_network

  frontend:
    image: clara690/job_frontend:${DOCKER_IMAGE_VERSION}
    ports:
      # TEMPORARY, same reasoning as above.
      - "3000:80"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.labels.app==true]
    networks:
      - my_swarm_network

networks:
  my_swarm_network:
    external: true

secrets:
  mysql_user_password_v2:
    external: true
